version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_vigiamed
    restart: always
    environment:
      MYSQL_DATABASE: VigiaMed
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # Define senha vazia como no seu properties
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: spring_vigiamed
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/VigiaMed?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=